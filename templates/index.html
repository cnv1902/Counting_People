<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Counting People with YOLOv8</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #video-stream { width: 100%; max-width: 800px; }
    </style>
</head>
<body class="container py-4">
    <h2 class="mb-4">Counting People with YOLOv8</h2>
    <form method="post" action="/upload" enctype="multipart/form-data" class="mb-3">
        <div class="mb-2">
            <label for="video" class="form-label">Chọn tệp video:</label>
            <input type="file" name="video" id="video" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Tải lên và xử lý</button>
    </form>
    <form method="get" action="/video_feed" class="mb-3">
        <button type="submit" name="source" value="camera" class="btn btn-success">Kết nối Camera</button>
    </form>
    <form method="post" action="/set_line" class="mb-3">
        <label for="line_points" class="form-label">Nhập tọa độ đường đếm (vd: 100,200;400,200):</label>
        <input type="text" name="line_points" id="line_points" class="form-control" required>
        <button type="submit" class="btn btn-warning mt-2">Xác nhận đường đếm</button>
    </form>
    <div>
        <h5>Kết quả:</h5>
        <img id="video-stream" src="/video_feed?source=camera" alt="Video stream">
    </div>
</body>
</html>
